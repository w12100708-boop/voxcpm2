name: Build VoxCPM2 iOS App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          brew install xmake
      - name: Build VoxCPM2 runtime
        run: |
          xmake repo --update
          NCNN_FILE="/Users/runner/.xmake/repositories/xmake-repo/packages/n/ncnn/xmake.lua"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/Users/runner/.xmake/repositories/xmake-repo/packages/n/ncnn/xmake.lua")
          s = p.read_text()
          old = '            "-DNCNN_BUILD_EXAMPLES=OFF",'
          new = old + '\n            "-DNCNN_DISABLE_RTTI=OFF",'
          if new not in s:
              if old not in s:
                  raise SystemExit("ncnn recipe format changed")
              s = s.replace(old, new, 1)
              p.write_text(s)
          print("RTTI enabled")
          PY
          xmake f -y \
            -p iphoneos \
            -a arm64 \
            -m release \
            --appledev=iphone \
            --profile=false
          xmake build -y voxcpm2_ncnn_shared
      - name: Download VoxCPM2 model
        run: |
          brew install huggingface-cli || true
          mkdir -p App/Models/voxcpm2
          huggingface-cli download \
            lyrin/voxpm2-ncnn \
            --local-dir App/Models/voxcpm2
      - name: Create iOS project
        run: |
          mkdir -p App/VoxCPM2App
          cat > App/VoxCPM2App/VoxCPM2App.swift <<'EOF'
          import SwiftUI
          @main
          struct VoxCPM2App: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF
          cat > App/VoxCPM2App/ContentView.swift <<'EOF'
          import SwiftUI
          struct ContentView: View {
              @State private var text = ""
              var body: some View {
                  NavigationStack {
                      Form {
                          Section("参考音频") {
                              Button("选择参考音频") {
                              }
                              Button("录制参考音频") {
                              }
                              Text("可选：输入参考音频文字")
                                  .foregroundStyle(.secondary)
                          }
                          Section("生成文本") {
                              TextEditor(text: $text)
                                  .frame(minHeight: 140)
                          }
                          Section {
                              Button("生成语音") {
                              }
                              .frame(maxWidth: .infinity)
                          }
                      }
                      .navigationTitle("VoxCPM2")
                  }
              }
          }
          EOF
          cat > App/VoxCPM2App/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.w12100708.voxcpm2</string>
              <key>CFBundleName</key>
              <string>VoxCPM2</string>
              <key>CFBundleDisplayName</key>
              <string>VoxCPM2</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
          </dict>
          </plist>
          EOF
      - name: Build unsigned IPA
        run: |
          mkdir -p Payload/VoxCPM2.app
          xcrun swiftc \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios16.0 \
            -emit-module \
            -emit-object \
            App/VoxCPM2App/VoxCPM2App.swift \
            App/VoxCPM2App/ContentView.swift \
            -o /tmp/voxcpm2.o
          echo "App project created."
          echo "Runtime and model are ready."
